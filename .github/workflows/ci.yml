name: Homaid CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        env:
          ADMIN_API_TOKEN: ci-only-not-a-real-secret
        run: docker compose config --quiet

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test and check API
        working-directory: api
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run check

      - name: Build React frontend
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build API container
        run: docker build -t homaid-api:ci ./api

      - name: Build web container
        run: docker build -t homaid-web:ci ./web
